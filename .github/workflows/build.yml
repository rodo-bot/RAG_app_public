name: Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: src
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller
      - name: Run tests
        working-directory: src
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build macOS app and MCP server
        working-directory: src
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Package build
        working-directory: src
        run: |
          package="RAG-Knowledge-Base-macOS-${{ matrix.architecture }}"
          mkdir -p "$package"
          cp -R "dist/RAG Knowledge Base.app" "$package/"
          cp "dist/RAG Knowledge Base MCP" "$package/"
          cp MACOS_README.md "$package/README.md"
          cp LLM_INSTRUCTIONS.md "$package/"
          ditto -c -k --sequesterRsrc --keepParent "$package" "$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: RAG-Knowledge-Base-macOS-${{ matrix.architecture }}
          path: src/RAG-Knowledge-Base-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error

  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --upgrade pip
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt pyinstaller
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Build Windows app and MCP server
        run: |
          $py = '.\.venv\Scripts\python.exe'
          & $py -m PyInstaller --noconfirm --onefile --windowed --collect-binaries sqlite_vec --name 'RAG Knowledge Base' --distpath dist --workpath build\desktop 'RAG Knowledge Base Desktop.pyw'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
          & $py -m PyInstaller --noconfirm --onefile --console --collect-binaries sqlite_vec --name 'RAG Knowledge Base MCP' --distpath dist --workpath build\mcp 'RAG Knowledge Base MCP.py'
          if ($LASTEXITCODE -ne 0) { throw 'MCP build failed.' }
          foreach ($exe in 'dist\RAG Knowledge Base.exe', 'dist\RAG Knowledge Base MCP.exe') {
            if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
          }
      - name: Package build
        run: |
          $package = 'RAG-Knowledge-Base-Windows-x86_64'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item -LiteralPath 'dist\RAG Knowledge Base.exe' -Destination $package
          Copy-Item -LiteralPath 'dist\RAG Knowledge Base MCP.exe' -Destination $package
          Copy-Item -LiteralPath 'WINDOWS_README.md' -Destination "$package\README.md"
          Copy-Item -LiteralPath 'LLM_INSTRUCTIONS.md' -Destination $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: RAG-Knowledge-Base-Windows-x86_64
          path: src/RAG-Knowledge-Base-Windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-build, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: RAG-Knowledge-Base-*
          path: artifacts
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
              --repo "${GITHUB_REPOSITORY}" --generate-notes
          fi
